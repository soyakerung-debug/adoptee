<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Adoptee</title>
    <link rel="stylesheet" href="assets/css/signin.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

<header class="header">
    <div class="nav">
        <img src="assets/images/pets/Screenshot_2026-01-24_135920-removebg-preview.png" class="logo">

        <a href="index.html" class="nav-btn">Home</a>

    </div>
</header>

<section class="signin-container">


    <div class="signin-image">
        <img src="https://images.unsplash.com/photo-1548199973-03cce0bbc87b" alt="Dogs">
    </div>


    <div class="signin-form">

        <h2>Welcome Back!</h2>
        <p class="subtitle">Your furry friends are waiting</p>

        <form id="signinForm">

          <input type="email" id="email" placeholder="Email address" required>


            <div class="password-box">
                <input type="password" id="password" placeholder="Password" required>
                <span class="toggle-eye">👁️</span>
            </div>

            <div class="forgot">
                <a href="#" id="forgotLink">Forgot password?</a>
            </div>

            <button type="submit">Let’s Go</button>

            <p class="extra">
                New here? <a href="create.html">Create an account</a>
            </p>

        </form>
    </div>

</section>

<div id="popup" class="success-popup">Signed in successfully!</div>

<script src="assets/js/signin.js"></script>

</body>
</html>
